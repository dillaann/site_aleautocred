<!--
  Marca da Ale Auto Cred.

  Reconstruída em vetor a partir do arquivo enviado pelo cliente em
  24/09/2026, que era um PNG digitalizado (CamScanner) de 1125x1189 com
  marca d'água. A geometria foi medida no próprio arquivo: quadrado de
  645px com canto de 53px (8,2%), traço de 60px (9,3%) e dois ganchos de
  raio 24% — um "C" abrindo à esquerda em cima e outro à direita embaixo,
  entrelaçados. A reconstrução bate com o original em 5,7/255 de diferença
  média; o que sobra é a borda suavizada do escaneamento.

  COR: o original do cliente era #39B5FF. Trocamos pela tinta do site,
  #006AA8, a pedido em 24/09/2026 — a marca passou a usar a cor do site, e
  não o contrário. É a mesma cor dos botões cheios, então a marca e a ação
  principal falam a mesma língua. Ela está escrita à mão aqui, e não como
  variável de CSS, porque um SVG carregado como favicon ou por tag de
  imagem não enxerga o CSS da página: se a paleta mudar, mude aqui também.
  (Nota: comentário de XML não aceita dois hifens seguidos, então o nome
  do token de cor não pode ser escrito por extenso aqui dentro.)

  De quebra, resolveu um problema de leitura: o branco sobre a tinta dá
  5,79:1, contra 2,28:1 do azul original do cliente. Era por causa desse
  contraste baixo que os dois ganchos se fundiam a 16px. Agora lê.

  Se o cliente enviar o vetor original (AI, SVG ou PDF), aproveite a
  geometria dele mas mantenha esta cor — isto aqui é uma reconstrução.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ale Auto Cred">
  <rect width="100" height="100" rx="8.2" fill="#006AA8"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="9.3">
    <path d="M33.5 14 H62.5 A24 24 0 0 1 62.5 62 H33.5"/>
    <path d="M66.5 38 H37.5 A24 24 0 0 0 37.5 86 H66.5"/>
  </g>
</svg>
